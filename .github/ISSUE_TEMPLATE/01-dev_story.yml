name: 🛠 Dev Story
description: Template for creating development-focused stories in InfiniLore
title: 'DevStory | '
assignees:
  - AnnaSasDev
labels:
  - dev story
  - enhancement
projects:
  - InfiniLore/1
type: Task

# ------------------------------------------
#             ACTUAL FORM BODY
# ------------------------------------------
body:
  - type: markdown
    attributes:
      value: >+
        ## 🦆 InfiniLore : Dev Story

        **Dev stories are used to describe development tasks, technical improvements, and infrastructure work.**  

        Please fill out the sections below to define the task and its scope. ⚙️  

  - type: markdown
    attributes:
      value: ---
        
  - type: textarea
    id: task-description
    attributes:
      label: 📝 Task Description
      description: What is the development task? What needs to be done?  
      placeholder: As a developer, I need to... so that...
    validations:
      required: true

  - type: textarea
    id: technical-details
    attributes:
      label: 🛠 Technical Details
      description: Any relevant technical info, references, or links to documents (Optional)
      placeholder: ex. Code snippets, architecture diagrams, or links to related pull requests

  - type: markdown
    attributes:
      value: |-
        ---
        ## ✅ Acceptance Criteria 🎯

        Define the technical conditions that must be met for the task to be considered complete.

  - type: textarea
    id: dev-side-criteria
    attributes:
      label: 🔧 Dev-Side Criteria
      description: >-
        What technical aspects must be satisfied once this task is completed?
        (Optional)
      placeholder: >-
        ex. The API must return the expected status codes for errors

  - type: textarea
    id: testing-requirements
    attributes:
      label: 🔬 Testing Requirements
      description: What testing needs to be performed to ensure the task is properly completed?  
      placeholder: ex. Unit tests for each new method, integration testing, etc.

  - type: dropdown
    id: progran-section
    attributes:
      label: 📐 Application Section
      description: What does feature belong to
      options:
        - 🔗 API
        - 🎨 UI
        - 🚨 Testing
    validations:
      required: true

  - type: markdown
    attributes:
      value: |-
        ---
        ### 💡 Notes & Inspiration 🌟  
        - Need help with the implementation? Check out the [InfiniLore Dev Docs](#) 📖  
        - If unsure about any technical detail, please consult the team or post in the comments! 🗣️  

        ---
        
        _Template generated with [Issue Forms Creator](https://issue-forms-creator.netlify.app)_
